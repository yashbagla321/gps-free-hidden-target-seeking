; Campaign 2027 defaults (plan §4.2, §5). These values are the working
; set during Gate B; they FREEZE at the start of Gate C. Every threshold here
; is swept in the sensitivity study before freezing.

[supervisor]
cert_on_deg = 10.0        ; certify: 1.96*sqrt(var_ctrl) <= this
cert_off_deg = 15.0       ; retrigger EXCITE above this (control-path var)
min_correlation = 0.5     ; gross-mismatch detector only (see Supervisor.hpp)
min_window_packets = 8
consecutive_windows = 3
min_dwell_s = 1.0
theta_drift_rate = 0.002  ; [rad/sqrt(s)] relay-yaw random-walk intensity
change_chi_thresh = 9.0   ; squared 3-sigma inconsistency threshold
change_adopt_after = 10   ; consecutive certified inconsistent windows
change_min_duration_s = 4.0 ; persistence through one window turnover
change_min_interval_s = 2.0 ; rate limit between change adoptions

[excite]
v = 0.6                   ; [m/s] constant-curvature acquisition arc
omega = 0.45              ; [rad/s]

[seek]
k_p = 0.8
k_omega = 2.0
v_max = 1.0               ; [m/s]
omega_max = 1.2           ; [rad/s]
maintain_enter = 0.20     ; [m]
maintain_exit = 0.30      ; [m]

[filter]
k_e = 2.0                 ; [1/s]

[registration]
max_packets = 64
max_age_s = 4.0
min_packets = 2
min_spread = 1e-4         ; [m^2]
; The delivered yaw variance includes correlated translation-random-walk
; odometry exactly to first order: Cov(e_i,e_j)=min(v_i,v_j)-v_min.

[smoother]
max_poses = 32
solve_every_packets = 5
max_iters = 15
huber_delta = 2.0
prior_bias_sigma = 0.05   ; [m/s]

[sensing]
rate_hz = 20
sigma_r = 0.10            ; [m]
sigma_beta_deg = 1.0

[sim]
dt = 0.01                 ; [s]
success_reach = 0.25      ; [m] (plan §5 primary criterion)
success_hold = 0.35       ; [m] for 10 s
